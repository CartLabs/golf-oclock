name: Fast alert poll

on:
  schedule:
    - cron: '*/5 9-23,0-3 * * *'
  workflow_dispatch:

# Shares a lane with the full poll so the two can never write seen.json at once.
concurrency:
  group: golf-poll
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  hot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Poll only what you have alerts on
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
        run: node src/index.js --hot

      - name: Save alert state
        run: |
          git config user.name  "golf-oclock-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/seen.json
          if git diff --staged --quiet; then
            echo "No change."
            exit 0
          fi
          git commit -m "fast poll $(date -u +'%H:%M UTC')"
          for i in 1 2 3 4 5; do
            if git push; then exit 0; fi
            git pull --rebase --autostash origin main || git rebase --abort || true
            sleep $((i * 3))
          done
          echo "::warning::Could not push alert state after 5 attempts."
          exit 0
