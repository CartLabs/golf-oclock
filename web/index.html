<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Golf O'Clock">
<meta name="theme-color" content="#f7f9f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101613" media="(prefers-color-scheme: dark)">
<meta name="description" content="Every open tee time near you, in one place.">
<meta property="og:title" content="Golf O'Clock">
<meta property="og:description" content="Every open tee time near you, in one place.">
<meta property="og:type" content="website">
<meta property="og:image" content="og.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="og.png">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Golf O'Clock</title>
<style>
  /* ───────────────────────────────────────────────────────────
     Light-first. This app gets opened outdoors in daylight, so
     contrast is tuned for sun, not for a desk. Dark follows the
     phone's setting automatically.
     System fonts only — no CDN, so it renders instantly and works
     with no signal at all.
     ─────────────────────────────────────────────────────────── */
  :root {
    --bg:        #f7f9f6;
    --card:      #ffffff;
    --sunk:      #eef2ec;
    --line:      #d5ddd4;
    --line-soft: #e6ece5;

    --ink:       #101613;   /* 15.9:1 on --bg */
    --ink-2:     #3d4b43;   /* 8.2:1  — secondary but still sunlight-legible */
    --ink-3:     #66756b;   /* 4.9:1  — smallest details only */

    /* Brand: navy + grass green, from the Golf O'Clock mark.
       --sel is the selected/active fill; --green is the accent used for
       availability, prices and the home tag. */
    --navy:      #16295c;
    --sel:       #16295c;
    --sel-ink:   #ffffff;
    --green:     #3f8f37;
    --green-ink: #ffffff;
    --green-bg:  #e8f3e4;
    --green-line:#9ac98a;

    --alert:     #a33417;
    --alert-bg:  #fbeae5;

    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
            "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;

    --r:    12px;
    --r-sm: 9px;
    --tap:  46px;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg:        #101613;
      --card:      #18201b;
      --sunk:      #202a23;
      --line:      #2d3a32;
      --line-soft: #232e27;

      --ink:       #eef4ef;
      --ink-2:     #b3c2b8;
      --ink-3:     #7e8f85;

      /* Navy is too dark to select against a dark ground, so the bright
         brand green takes over as the selection fill here. */
      --navy:      #6f8ad6;
      --sel:       #7cc142;
      --sel-ink:   #0d1a08;
      --green:     #7cc142;
      --green-ink: #0d1a08;
      --green-bg:  #1c2a16;
      --green-line:#3f6b2c;

      --alert:     #f08a68;
      --alert-bg:  #2b1a14;
    }
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    overflow-x: hidden;
    -webkit-text-size-adjust: 100%;
    padding-bottom: calc(24px + env(safe-area-inset-bottom));
  }

  /* ─── header ─── */
  .top {
    position: sticky; top: 0; z-index: 50;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
  }
  header {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; padding: 12px 16px;
    padding-top: max(12px, calc(env(safe-area-inset-top) + 6px));
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand svg { width: 26px; height: 26px; flex: none; display: block; }
  .mark .m-ring  { fill: none; stroke: var(--green); stroke-width: 1.9; }
  .mark .m-ball  { fill: #f3f7f3; }
  .mark .m-hands { fill: none; stroke: #16295c; stroke-width: 1.7; stroke-linecap: round; }
  .mark .m-dot   { fill: var(--green); }
  .mark .m-tee   { fill: var(--ink-2); }
  .brand h1 {
    font-size: 19px; font-weight: 700; letter-spacing: -0.02em;
  }
  .refresh {
    width: 40px; height: 40px; flex: none;
    border: 1px solid var(--line); border-radius: 50%;
    background: var(--card); color: var(--ink-2);
    font-size: 18px; cursor: pointer;
    display: grid; place-items: center;
  }
  .refresh:active { background: var(--sunk); }
  .refresh.spin { animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ─── day strip ─── */
  .days {
    display: flex; gap: 7px; overflow-x: auto;
    padding: 10px 16px 12px;
    scrollbar-width: none; -webkit-overflow-scrolling: touch;
  }
  .days::-webkit-scrollbar { display: none; }
  .day {
    flex: none; min-width: 60px; padding: 7px 10px 8px;
    border: 1px solid var(--line); border-radius: var(--r-sm);
    background: var(--card); color: var(--ink);
    font-family: inherit; text-align: center; cursor: pointer;
    line-height: 1.15;
  }
  .day .dow {
    display: block; font-size: 10px; font-weight: 700;
    letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3);
  }
  .day .num { display: block; font-size: 19px; font-weight: 700; margin: 1px 0; }
  .day .cnt { display: block; font-family: var(--mono); font-size: 10.5px; color: var(--ink-3); }
  .day.on {
    background: var(--sel); border-color: var(--sel); color: var(--sel-ink);
  }
  .day.on .dow, .day.on .cnt { color: var(--sel-ink); opacity: .9; }
  .day.zero { opacity: .42; }

  /* ─── filters ─── */
  .filters { padding: 0 16px; display: grid; gap: 10px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .seg {
    display: flex; background: var(--card);
    border: 1px solid var(--line); border-radius: var(--r-sm); overflow: hidden;
  }
  .seg button {
    min-height: 40px; padding: 0 15px; border: 0; background: transparent;
    color: var(--ink-2); font: 600 14px/1 var(--font); cursor: pointer;
  }
  .seg button + button { border-left: 1px solid var(--line-soft); }
  .seg button.on { background: var(--sel); color: var(--sel-ink); }

  .more-btn {
    min-height: 40px; padding: 0 15px; margin-left: auto;
    border: 1px solid var(--line); border-radius: var(--r-sm);
    background: var(--card); color: var(--ink);
    font: 600 14px/1 var(--font); cursor: pointer;
  }

  .panel[hidden] { display: none; }
  .panel {
    display: grid; gap: 13px;
    grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
    padding: 14px; background: var(--card);
    border: 1px solid var(--line); border-radius: var(--r);
  }
  .field { display: flex; flex-direction: column; gap: 5px; }
  .field > span {
    font-size: 11px; font-weight: 700; letter-spacing: .06em;
    text-transform: uppercase; color: var(--ink-3);
  }
  .field input {
    min-height: 42px; padding: 8px 11px;
    border: 1px solid var(--line); border-radius: var(--r-sm);
    background: var(--bg); color: var(--ink);
    font: 500 15px/1 var(--font);
  }
  .field input:focus { outline: 2px solid var(--green); outline-offset: -1px; }

  .courses { grid-column: 1 / -1; }
  .courses-head {
    display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;
  }
  .courses-head > span {
    font-size: 11px; font-weight: 700; letter-spacing: .06em;
    text-transform: uppercase; color: var(--ink-3);
  }
  .linkbtn {
    border: 0; background: none; color: var(--green);
    font: 600 13px/1 var(--font); cursor: pointer; padding: 5px;
  }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    padding: 8px 12px; border: 1px solid var(--line); border-radius: 999px;
    background: var(--bg); color: var(--ink-3);
    font: 500 13px/1 var(--font); cursor: pointer;
  }
  .chip.on {
    background: var(--green-bg); border-color: var(--green-line); color: var(--ink);
  }

  /* ─── results ─── */
  .results { padding: 12px 16px 20px; display: grid; gap: 11px; }

  .course {
    background: var(--card); border: 1px solid var(--line);
    border-radius: var(--r); overflow: hidden;
  }
  .course-head {
    display: flex; justify-content: space-between; align-items: baseline;
    gap: 10px; padding: 13px 14px 9px;
  }
  .course-head h2 { font-size: 16px; font-weight: 700; letter-spacing: -0.015em; }
  .home-tag {
    display: inline-block; margin-left: 7px; vertical-align: 2px;
    padding: 2px 7px; border-radius: 999px;
    border: 1px solid var(--green-line); background: var(--green-bg);
    color: var(--green); font-size: 10px; font-weight: 700;
    letter-spacing: .07em; text-transform: uppercase;
  }
  .course.is-home { border-color: var(--green-line); }
  .course-head .loc {
    font-family: var(--mono); font-size: 11px; color: var(--ink-3);
    text-align: right; flex: none; white-space: nowrap;
  }

  .tees { display: flex; flex-wrap: wrap; gap: 7px; padding: 0 14px 14px; }
  .tee {
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    min-width: 82px; min-height: var(--tap); padding: 7px 10px 8px;
    border: 1px solid var(--line); border-radius: var(--r-sm);
    background: var(--sunk); color: var(--ink); text-decoration: none;
  }
  .tee:active { background: var(--green-bg); }
  .tee .t { font-size: 15px; font-weight: 700; letter-spacing: -0.02em; }
  .tee .meta {
    display: flex; align-items: center; gap: 5px;
    font-family: var(--mono); font-size: 10.5px; color: var(--ink-3);
  }
  /* Player availability as scorecard-style pips — faster to read in sun than "3p" */
  .pips { display: inline-flex; gap: 2.5px; }
  .pip { width: 5px; height: 5px; border-radius: 50%; background: var(--line); }
  .pip.on { background: var(--green); }
  .tee.full { border-color: var(--green-line); background: var(--green-bg); }

  .empty { text-align: center; padding: 48px 24px; color: var(--ink-3); }
  .empty .h { font-size: 16px; font-weight: 700; color: var(--ink-2); margin-bottom: 6px; }

  .notice {
    margin: 0 16px; padding: 10px 13px;
    border: 1px solid var(--line); border-left: 3px solid var(--alert);
    border-radius: var(--r-sm); background: var(--alert-bg);
    font-size: 13px; color: var(--ink-2);
  }

  footer {
    padding: 2px 16px; font-family: var(--mono);
    font-size: 11px; color: var(--ink-3);
  }

  /* ─── view switching ─── */
  body[data-view="alerts"] .days,
  body[data-view="alerts"] .filters,
  body[data-view="alerts"] #notice,
  body[data-view="alerts"] .results,
  body[data-view="alerts"] footer,
  body[data-view="alerts"] #loading { display: none; }
  body:not([data-view="alerts"]) #view-alerts { display: none; }

  .iconbtn {
    width: 40px; height: 40px; flex: none;
    border: 1px solid var(--line); border-radius: 50%;
    background: var(--card); color: var(--ink-2);
    cursor: pointer; display: grid; place-items: center; position: relative;
  }
  .iconbtn svg { width: 19px; height: 19px; display: block; }
  .iconbtn.on { background: var(--sel); border-color: var(--sel); color: var(--sel-ink); }
  .iconbtn .badge {
    position: absolute; top: -3px; right: -3px; min-width: 17px; height: 17px;
    padding: 0 4px; border-radius: 9px; background: var(--green); color: var(--green-ink);
    font: 700 10px/17px var(--font); text-align: center;
  }
  .head-actions { display: flex; gap: 8px; align-items: center; }

  /* ─── alerts view ─── */
  #view-alerts { padding: 14px 16px 28px; display: grid; gap: 13px; }
  .a-intro { font-size: 13.5px; color: var(--ink-2); line-height: 1.5; }

  .card2 {
    background: var(--card); border: 1px solid var(--line);
    border-radius: var(--r); padding: 14px; display: grid; gap: 12px;
  }
  .card2 h3 { font-size: 15px; font-weight: 700; }
  .card2 p { font-size: 13px; color: var(--ink-2); line-height: 1.5; }
  .card2 ol { font-size: 13px; color: var(--ink-2); line-height: 1.6; padding-left: 18px; }
  .card2 code {
    font-family: var(--mono); font-size: 12px;
    background: var(--sunk); padding: 1px 5px; border-radius: 4px;
  }

  .btn {
    min-height: 44px; padding: 0 16px; border: 1px solid var(--sel);
    border-radius: var(--r-sm); background: var(--sel); color: var(--sel-ink);
    font: 700 14px/1 var(--font); cursor: pointer;
  }
  .btn.ghost { background: var(--card); color: var(--ink); border-color: var(--line); }
  .btn.danger { background: var(--card); color: var(--alert); border-color: var(--line); }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn-row { display: flex; gap: 8px; flex-wrap: wrap; }

  .watch {
    background: var(--card); border: 1px solid var(--line);
    border-radius: var(--r); padding: 13px 14px; display: grid; gap: 9px;
  }
  .watch.off { opacity: .55; }
  .watch.expired { border-style: dashed; }
  .watch-top { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
  .watch-top h4 { font-size: 15px; font-weight: 700; }
  .watch dl { display: grid; gap: 3px; font-size: 12.5px; color: var(--ink-2); }
  .watch .tagrow { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .pill {
    font: 600 11px/1 var(--font); letter-spacing: .04em; text-transform: uppercase;
    padding: 5px 9px; border-radius: 999px;
    border: 1px solid var(--green-line); background: var(--green-bg); color: var(--green);
  }
  .pill.grey { border-color: var(--line); background: var(--sunk); color: var(--ink-3); }
  .pill.warn { border-color: var(--alert); background: var(--alert-bg); color: var(--alert); }

  .switch {
    position: relative; width: 46px; height: 27px; flex: none;
    border-radius: 999px; border: 1px solid var(--line);
    background: var(--sunk); cursor: pointer; padding: 0;
  }
  .switch::after {
    content: ''; position: absolute; top: 2px; left: 2px;
    width: 21px; height: 21px; border-radius: 50%;
    background: var(--ink-3); transition: transform .15s ease, background .15s ease;
  }
  .switch.on { background: var(--green-bg); border-color: var(--green-line); }
  .switch.on::after { transform: translateX(19px); background: var(--green); }

  .match-note {
    font-size: 13px; padding: 10px 12px; border-radius: var(--r-sm);
    border: 1px solid var(--green-line); background: var(--green-bg); color: var(--ink-2);
  }
  .match-note.zero { border-color: var(--line); background: var(--sunk); color: var(--ink-3); }
  .match-note b { color: var(--ink); }

  .save-state { font-size: 13px; color: var(--ink-2); min-height: 18px; }
  .save-state.err { color: var(--alert); font-weight: 600; }
  .save-state.ok  { color: var(--green); font-weight: 600; }

  .loading { padding: 14px 16px; font-size: 14px; color: var(--ink-2); }
  .loading.err { color: var(--alert); font-weight: 600; }
  .loading:empty { display: none; }
</style>
</head>
<body>

<div class="top">
  <header>
    <div class="brand">
      <svg viewBox="0 0 24 24" aria-hidden="true" class="mark">
        <path class="m-tee" d="M9.7 16.1h4.6a.9.9 0 0 1 0 1.8H9.7a.9.9 0 0 1 0-1.8z"/>
        <path class="m-tee" d="M10.5 17.6h3l-.45 3.8a1.05 1.05 0 0 1-2.1 0z"/>
        <circle class="m-ball" cx="12" cy="9.8" r="5.9"/>
        <circle class="m-ring" cx="12" cy="9.8" r="7.1"/>
        <path class="m-hands" d="M12 9.8 9.1 6.9M12 9.8l3.5 2.9"/>
        <circle class="m-dot" cx="12" cy="9.8" r=".95"/>
      </svg>
      <h1>Golf O'Clock</h1>
    </div>
    <div class="head-actions">
      <button class="iconbtn" id="alerts-btn" aria-label="Alerts" title="Alerts">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
          <path d="M13.7 21a2 2 0 0 1-3.4 0"/>
        </svg>
      </button>
      <button class="refresh" id="refresh" aria-label="Refresh">&#8635;</button>
    </div>
  </header>
  <nav class="days" id="days" aria-label="Choose a date"></nav>
</div>

<div class="loading" id="loading" role="status">Loading tee times&hellip;</div>

<section class="filters">
  <div class="row">
    <div class="seg" role="group" aria-label="Holes">
      <button data-holes="any" class="on">Any</button>
      <button data-holes="9">9</button>
      <button data-holes="18">18</button>
    </div>
    <div class="seg" role="group" aria-label="Players">
      <button data-players="1" class="on">1+</button>
      <button data-players="2">2+</button>
      <button data-players="4">4</button>
    </div>
    <button class="more-btn" id="more-btn" aria-expanded="false">Filters</button>
  </div>

  <div class="panel" id="panel" hidden>
    <label class="field"><span>Earliest</span><input type="time" id="from" value="05:00" step="900"></label>
    <label class="field"><span>Latest</span><input type="time" id="to" value="20:00" step="900"></label>
    <label class="field"><span>Max green fee</span><input type="number" id="maxfee" placeholder="any" min="0" step="5" inputmode="numeric"></label>
    <div class="courses">
      <div class="courses-head">
        <span>Courses</span>
        <button class="linkbtn" id="toggle-all" type="button">Toggle all</button>
      </div>
      <div class="chips" id="chips"></div>
    </div>
  </div>
</section>

<div id="notice"></div>
<main class="results" id="results"></main>
<section id="view-alerts" aria-label="Alerts"></section>

<footer><span id="updated"></span></footer>

<script>
(function () {
  'use strict';

  var SOURCES = ['data/teetimes.json', '../data/teetimes.json'];

  var state = {
    data: null, date: null, holes: 'any', players: 1,
    from: '05:00', to: '20:00', maxFee: null, hidden: loadHidden()
  };

  function $(s) { return document.querySelector(s); }
  function el(tag, cls, txt) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (txt != null) n.textContent = txt;
    return n;
  }

  function loadHidden() {
    try { return new Set(JSON.parse(localStorage.getItem('golf.hidden') || '[]')); }
    catch (e) { return new Set(); }
  }
  function saveHidden() {
    try { localStorage.setItem('golf.hidden', JSON.stringify(Array.from(state.hidden))); }
    catch (e) {}
  }

  function load(force) {
    var l = $('#loading');
    l.className = 'loading';
    l.textContent = 'Loading tee times…';
    $('#refresh').classList.add('spin');

    var urls = SOURCES.map(function (u) { return force ? u + '?v=' + Date.now() : u; });

    (function attempt(i) {
      if (i >= urls.length) {
        $('#refresh').classList.remove('spin');
        l.className = 'loading err';
        l.textContent = 'Could not load tee times. Has the poller run yet?';
        return;
      }
      fetch(urls[i], { cache: force ? 'reload' : 'default' })
        .then(function (r) { if (!r.ok) throw 0; return r.json(); })
        .then(function (json) {
          $('#refresh').classList.remove('spin');
          state.data = json; l.textContent = ''; boot();
        })
        .catch(function () { attempt(i + 1); });
    })(0);
  }

  function boot() {
    var d = state.data;
    if (!state.date || dates().indexOf(state.date) === -1) state.date = dates()[0] || null;
    renderDays(); renderChips(); render();

    var when = d.updatedAt ? new Date(d.updatedAt) : null;
    $('#updated').textContent = when
      ? 'Updated ' + ago(when) + ' · ' + d.slotCount + ' slots · ' + d.courseCount + ' courses'
      : '';

    var f = d.failures || [];
    $('#notice').innerHTML = '';
    if (f.length) {
      $('#notice').appendChild(el('div', 'notice',
        f.length + ' course' + (f.length > 1 ? 's' : '') + " didn't respond this run: " +
        f.map(function (x) { return x.course; }).join(', ')));
    }
  }

  function dates() {
    var seen = {};
    (state.data.slots || []).forEach(function (s) { seen[s.date] = 1; });
    return Object.keys(seen).sort();
  }

  function passes(s) {
    if (s.date !== state.date) return false;
    if (state.hidden.has(s.courseId)) return false;
    if (state.holes !== 'any' && s.holes != null && String(s.holes) !== state.holes) return false;
    if ((s.availableSpots || 0) < state.players) return false;
    if (state.from && s.time24 < state.from) return false;
    if (state.to && s.time24 > state.to) return false;
    if (state.maxFee != null && (s.greenFee == null || s.greenFee > state.maxFee)) return false;
    return true;
  }

  function countOn(date) {
    var keep = state.date; state.date = date;
    var n = (state.data.slots || []).filter(passes).length;
    state.date = keep; return n;
  }

  function renderDays() {
    var wrap = $('#days'); wrap.innerHTML = '';
    dates().forEach(function (d) {
      var dt = new Date(d + 'T12:00:00Z');
      var n = countOn(d);
      var b = el('button', 'day' + (d === state.date ? ' on' : '') + (n === 0 ? ' zero' : ''));
      b.appendChild(el('span', 'dow', dt.toLocaleDateString('en-US', { weekday: 'short', timeZone: 'UTC' })));
      b.appendChild(el('span', 'num', String(dt.getUTCDate())));
      b.appendChild(el('span', 'cnt', n ? String(n) : '—'));
      b.addEventListener('click', function () { state.date = d; renderDays(); render(); });
      wrap.appendChild(b);
    });
  }

  function shortName(n) {
    return n.replace(/ (Golf|Country) Club$| Golf Course$| Country Club$/g, '');
  }

  function renderChips() {
    var wrap = $('#chips'); wrap.innerHTML = '';
    (state.data.courses || []).forEach(function (c) {
      var b = el('button', 'chip' + (state.hidden.has(c.id) ? '' : ' on'), shortName(c.name));
      b.type = 'button'; b.title = c.name;
      b.addEventListener('click', function () {
        if (state.hidden.has(c.id)) state.hidden.delete(c.id); else state.hidden.add(c.id);
        saveHidden(); renderChips(); renderDays(); render();
      });
      wrap.appendChild(b);
    });
  }

  function pips(open, max) {
    var cap = Math.max(1, Math.min(4, max || 4));
    var wrap = el('span', 'pips');
    for (var i = 0; i < cap; i++) {
      wrap.appendChild(el('span', 'pip' + (i < open ? ' on' : '')));
    }
    return wrap;
  }

  function render() {
    var out = $('#results'); out.innerHTML = '';
    var rows = (state.data.slots || []).filter(passes);

    if (!rows.length) {
      var e = el('div', 'empty');
      e.appendChild(el('div', 'h', 'Nothing open that matches.'));
      e.appendChild(el('div', null, 'Widen the time range, drop to 2+ players, or try another day.'));
      out.appendChild(e);
      return;
    }

    var groups = {}, order = [];
    rows.forEach(function (s) {
      if (!groups[s.courseId]) { groups[s.courseId] = []; order.push(s.courseId); }
      groups[s.courseId].push(s);
    });
    // Home courses first, then everything else by earliest available time.
    var homeIds = new Set((state.data.courses || [])
      .filter(function (c) { return c.home; })
      .map(function (c) { return c.id; }));

    order.sort(function (a, b) {
      var ah = homeIds.has(a) ? 0 : 1, bh = homeIds.has(b) ? 0 : 1;
      if (ah !== bh) return ah - bh;
      return groups[a][0].time24.localeCompare(groups[b][0].time24);
    });

    order.forEach(function (id) {
      var list = groups[id], first = list[0];
      var isHome = homeIds.has(id);
      var card = el('div', 'course' + (isHome ? ' is-home' : ''));

      var head = el('div', 'course-head');
      var h = el('h2', null, first.courseName);
      if (isHome) h.appendChild(el('span', 'home-tag', 'Home'));
      head.appendChild(h);
      head.appendChild(el('div', 'loc', first.town + ', ' + first.state + ' · ' + list.length));
      card.appendChild(head);

      var grid = el('div', 'tees');
      list.forEach(function (s) {
        var open = s.availableSpots || 0;
        var a = el('a', 'tee' + (open >= 4 ? ' full' : ''));
        a.href = s.bookingUrl; a.target = '_blank'; a.rel = 'noopener';
        a.title = open + ' spot' + (open === 1 ? '' : 's') + ' open';
        a.appendChild(el('span', 't', s.timeLabel));

        var meta = el('span', 'meta');
        if (s.holes) meta.appendChild(el('span', null, s.holes + 'h'));
        meta.appendChild(pips(open, s.maxPlayers));
        if (s.greenFee != null) meta.appendChild(el('span', null, '$' + s.greenFee));
        a.appendChild(meta);
        grid.appendChild(a);
      });
      card.appendChild(grid);
      out.appendChild(card);
    });
  }

  function ago(d) {
    var m = Math.round((Date.now() - d.getTime()) / 60000);
    if (m < 1) return 'just now';
    if (m < 60) return m + ' min ago';
    var h = Math.round(m / 60);
    if (h < 24) return h + (h === 1 ? ' hr ago' : ' hrs ago');
    return d.toLocaleDateString();
  }

  document.addEventListener('click', function (ev) {
    var b = ev.target.closest ? ev.target.closest('.seg button') : null;
    if (!b) return;
    Array.prototype.forEach.call(b.parentNode.children, function (c) { c.classList.remove('on'); });
    b.classList.add('on');
    if (b.dataset.holes) state.holes = b.dataset.holes;
    if (b.dataset.players) state.players = Number(b.dataset.players);
    renderDays(); render();
  });

  $('#more-btn').addEventListener('click', function () {
    var p = $('#panel');
    p.hidden = !p.hidden;
    this.setAttribute('aria-expanded', String(!p.hidden));
  });

  $('#from').addEventListener('change', function () { state.from = this.value; renderDays(); render(); });
  $('#to').addEventListener('change', function () { state.to = this.value; renderDays(); render(); });
  $('#maxfee').addEventListener('input', function () {
    var v = parseFloat(this.value);
    state.maxFee = isNaN(v) ? null : v;
    renderDays(); render();
  });

  $('#toggle-all').addEventListener('click', function () {
    if (state.hidden.size) state.hidden.clear();
    else (state.data.courses || []).forEach(function (c) { state.hidden.add(c.id); });
    saveHidden(); renderChips(); renderDays(); render();
  });

  $('#refresh').addEventListener('click', function () { load(true); });

  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && state.data) load(true);

    navigator.serviceWorker.register('sw.js').catch(function () {});
  }


  /* ── alerts ───────────────────────────────────────────────────────────
     Watches live in config/watches.json in the repo, because the poller
     that actually fires them runs in GitHub Actions — a phone can't wake
     itself up to check. So creating an alert here means committing that
     file, which is what the token is for.
     ------------------------------------------------------------------ */

  var WATCH_PATH = 'config/watches.json';

  var REPO = (function () {
    try {
      var o = JSON.parse(localStorage.getItem('golf.repo') || 'null');
      if (o && o.owner && o.repo) return o;
    } catch (e) {}
    // cartlabs.github.io/golf-oclock/  ->  owner "cartlabs", repo "golf-oclock"
    var host = (location.hostname || '').split('.')[0];
    var seg = (location.pathname || '').split('/').filter(Boolean)[0];
    return { owner: host || 'CartLabs', repo: seg || 'golf-oclock' };
  })();

  function token() { try { return localStorage.getItem('golf.token') || ''; } catch (e) { return ''; } }
  function setToken(t) {
    try { t ? localStorage.setItem('golf.token', t) : localStorage.removeItem('golf.token'); } catch (e) {}
  }

  var A = { watches: null, raw: null, sha: null, loading: false, error: '',
            draft: null, saving: false, msg: '', msgKind: '', editing: null };

  function b64encode(str) {
    var bytes = new TextEncoder().encode(str), bin = '';
    for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    return btoa(bin);
  }
  function b64decode(b64) {
    var bin = atob(String(b64).replace(/\s/g, '')), out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return new TextDecoder().decode(out);
  }

  function gh(path, opts) {
    opts = opts || {};
    var h = { 'accept': 'application/vnd.github+json' };
    if (token()) h.authorization = 'Bearer ' + token();
    if (opts.body) h['content-type'] = 'application/json';
    return fetch('https://api.github.com/repos/' + REPO.owner + '/' + REPO.repo + path, {
      method: opts.method || 'GET', headers: h, cache: 'no-store',
      body: opts.body ? JSON.stringify(opts.body) : undefined
    });
  }

  function todayLocal() {
    return new Date().toLocaleDateString('en-CA');   // YYYY-MM-DD
  }

  function loadWatches() {
    A.loading = true; A.error = ''; renderAlerts();
    var finish = function () { A.loading = false; renderAlerts(); };

    if (token()) {
      gh('/contents/' + WATCH_PATH).then(function (r) {
        if (r.status === 401 || r.status === 403) {
          throw new Error('GitHub rejected the token. It needs Contents: Read and write on ' + REPO.owner + '/' + REPO.repo + '.');
        }
        if (r.status === 404) throw new Error('Could not find ' + WATCH_PATH + ' in ' + REPO.owner + '/' + REPO.repo + '.');
        if (!r.ok) throw new Error('GitHub returned ' + r.status + '.');
        return r.json();
      }).then(function (j) {
        A.sha = j.sha;
        A.raw = JSON.parse(b64decode(j.content));
        A.watches = A.raw.watches || [];
        finish();
      }).catch(function (e) { A.error = e.message; finish(); });
      return;
    }

    // No token: show the published read-only copy so the screen still works.
    fetch('config/watches.json?t=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw 0; return r.json(); })
      .then(function (j) { A.raw = j; A.watches = j.watches || []; finish(); })
      .catch(function () { A.watches = []; finish(); });
  }

  function saveWatches(after) {
    if (!token()) return;
    A.saving = true; A.msg = 'Saving…'; A.msgKind = ''; renderAlerts();

    var payload = {};
    for (var k in (A.raw || {})) payload[k] = A.raw[k];
    payload.watches = A.watches;

    var body = {
      message: 'alerts: ' + A.watches.length + ' watch' + (A.watches.length === 1 ? '' : 'es'),
      content: b64encode(JSON.stringify(payload, null, 2) + '\n')
    };
    if (A.sha) body.sha = A.sha;

    gh('/contents/' + WATCH_PATH, { method: 'PUT', body: body })
      .then(function (r) {
        if (r.status === 409 || r.status === 422) {
          throw new Error('The file changed since you loaded it. Tap Reload, then try again.');
        }
        if (r.status === 401 || r.status === 403) {
          throw new Error('GitHub rejected the token. It needs Contents: Read and write.');
        }
        if (!r.ok) {
          return r.json().catch(function () { return {}; }).then(function (j) {
            throw new Error(j.message || ('GitHub returned ' + r.status + '.'));
          });
        }
        return r.json();
      })
      .then(function (j) {
        A.sha = j.content.sha;
        A.msg = 'Saved. Live within 15 minutes, on the next poll.';
        A.msgKind = 'ok';
        if (after) after();
      })
      .catch(function (e) { A.msg = e.message; A.msgKind = 'err'; })
      .then(function () { A.saving = false; renderAlerts(); });
  }

  /* Mirrors src/alerts.js matchesWatch, minus the enabled check, so the
     preview shows what a rule WOULD catch even while it's switched off. */
  function countMatches(w) {
    var slots = (state.data && state.data.slots) || [];
    var n = 0;
    for (var i = 0; i < slots.length; i++) {
      var s = slots[i];
      var cs = w.courses || ['any'];
      if (cs.indexOf('any') === -1 && cs.indexOf(s.courseId) === -1) continue;
      if (w.dates && w.dates.length && w.dates.indexOf(s.date) === -1) continue;
      if (w.daysOfWeek && w.daysOfWeek.length) {
        var dow = new Date(s.date + 'T12:00:00Z').getUTCDay();
        if (w.daysOfWeek.indexOf(dow) === -1) continue;
      }
      if (w.timeFrom && s.time24 < w.timeFrom) continue;
      if (w.timeTo && s.time24 > w.timeTo) continue;
      if (w.holes != null && s.holes != null && s.holes !== w.holes) continue;
      if (w.minSpots != null && (s.availableSpots || 0) < w.minSpots) continue;
      if (w.maxGreenFee != null && (s.greenFee == null || s.greenFee > w.maxGreenFee)) continue;
      n++;
    }
    return n;
  }

  function isExpired(w) {
    if (!w.dates || !w.dates.length) return false;
    var t = todayLocal();
    return w.dates.every(function (d) { return d < t; });
  }

  function prettyDate(iso) {
    return new Date(iso + 'T12:00:00Z').toLocaleDateString('en-US',
      { weekday: 'short', month: 'short', day: 'numeric', timeZone: 'UTC' });
  }

  function courseName(id) {
    var c = (state.data && state.data.courses || []).filter(function (x) { return x.id === id; })[0];
    return c ? shortName(c.name) : id;
  }

  function describe(w) {
    var who = (!w.courses || w.courses.indexOf('any') > -1)
      ? 'Any course'
      : w.courses.map(courseName).join(', ');
    var when = w.dates && w.dates.length ? w.dates.map(prettyDate).join(', ')
      : (w.daysOfWeek && w.daysOfWeek.length
          ? w.daysOfWeek.map(function (d) { return ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d]; }).join(', ')
          : 'Any day');
    var span = (w.timeFrom ? to12(w.timeFrom) : 'any time') + ' – ' + (w.timeTo ? to12(w.timeTo) : 'any time');
    var bits = [];
    if (w.holes) bits.push(w.holes + ' holes');
    if (w.minSpots) bits.push(w.minSpots + '+ player' + (w.minSpots === 1 ? '' : 's'));
    if (w.maxGreenFee != null) bits.push('under $' + w.maxGreenFee);
    return { who: who, when: when, span: span, extra: bits.join(' · ') };
  }

  function to12(t) {
    var p = t.split(':'), h = +p[0];
    return (h % 12 === 0 ? 12 : h % 12) + ':' + p[1] + (h >= 12 ? 'pm' : 'am');
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
    });
  }

  function newDraft() {
    var ds = dates();
    return {
      courses: ['any'],
      date: ds[0] || todayLocal(),
      timeFrom: '06:00',
      timeTo: '12:00',
      holes: null,
      minSpots: 1
    };
  }

  function draftToWatch(d) {
    var w = {
      label: (d.courses.indexOf('any') > -1 ? 'Any course' : d.courses.map(courseName).join(', '))
             + ' · ' + prettyDate(d.date),
      enabled: true,
      courses: d.courses.slice(),
      dates: [d.date],
      timeFrom: d.timeFrom,
      timeTo: d.timeTo,
      minSpots: d.minSpots
    };
    if (d.holes) w.holes = d.holes;
    return w;
  }

  /* ── rendering ── */

  function renderAlerts() {
    var root = $('#view-alerts');
    if (!root) return;
    root.innerHTML = '';

    // Token setup gate
    if (!token()) {
      root.appendChild(setupCard());
      if (A.watches && A.watches.length) {
        root.appendChild(el('div', 'a-intro', 'Your current alerts (read-only until you connect):'));
        A.watches.forEach(function (w, i) { root.appendChild(watchCard(w, i, true)); });
      }
      return;
    }

    if (A.loading) { root.appendChild(el('div', 'a-intro', 'Loading alerts…')); return; }

    if (A.error) {
      var e = el('div', 'card2');
      e.appendChild(el('h3', null, 'Could not reach GitHub'));
      e.appendChild(el('p', null, A.error));
      var row = el('div', 'btn-row');
      var again = el('button', 'btn', 'Try again');
      again.addEventListener('click', loadWatches);
      var forget = el('button', 'btn danger', 'Forget token');
      forget.addEventListener('click', function () { setToken(''); loadWatches(); });
      row.appendChild(again); row.appendChild(forget);
      e.appendChild(row);
      root.appendChild(e);
      return;
    }

    // draft form, or the "new alert" button
    if (A.draft) root.appendChild(draftForm());
    else {
      var add = el('button', 'btn', '+ New alert');
      add.addEventListener('click', function () { A.draft = newDraft(); A.msg = ''; renderAlerts(); });
      root.appendChild(add);
    }

    if (A.msg) {
      root.appendChild(el('div', 'save-state ' + (A.msgKind || ''), A.msg));
    }

    var list = A.watches || [];
    if (!list.length) {
      root.appendChild(el('div', 'a-intro',
        'No alerts yet. Create one and you will get a push the moment a matching tee time opens up.'));
    } else {
      list.forEach(function (w, i) { root.appendChild(watchCard(w, i, false)); });
    }

    var foot = el('div', 'a-intro',
      'Alerts are checked every 15 minutes. You are notified once when a slot opens, and again if it is taken and later frees up.');
    root.appendChild(foot);

    var tools = el('div', 'btn-row');
    var reload = el('button', 'btn ghost', 'Reload');
    reload.addEventListener('click', loadWatches);
    var disconnect = el('button', 'btn danger', 'Disconnect GitHub');
    disconnect.addEventListener('click', function () {
      setToken(''); A.sha = null; A.msg = ''; loadWatches();
    });
    tools.appendChild(reload); tools.appendChild(disconnect);
    root.appendChild(tools);
  }

  function setupCard() {
    var c = el('div', 'card2');
    c.appendChild(el('h3', null, 'Connect to save alerts'));
    var p = el('p', null,
      'Alerts run on a schedule in GitHub, not on your phone — a phone cannot wake itself up to check. ' +
      'To create one from here, the app needs permission to update a single file in your repo.');
    c.appendChild(p);

    var ol = document.createElement('ol');
    ol.innerHTML =
      '<li>On GitHub: <b>Settings → Developer settings → Personal access tokens → Fine-grained tokens → Generate new token</b></li>' +
      '<li>Repository access: <b>Only select repositories</b> → <code>' + esc(REPO.owner + '/' + REPO.repo) + '</code></li>' +
      '<li>Permissions: <b>Contents → Read and write</b>. Nothing else.</li>' +
      '<li>Set an expiry you are comfortable with, generate, and paste it below.</li>';
    c.appendChild(ol);

    var f = el('label', 'field');
    f.appendChild(el('span', null, 'Token'));
    var inp = document.createElement('input');
    inp.type = 'password'; inp.placeholder = 'github_pat_…'; inp.autocomplete = 'off';
    inp.id = 'tok-input';
    f.appendChild(inp);
    c.appendChild(f);

    c.appendChild(el('p', null,
      'Stored only in this browser, never in the repo. Note that ' + esc(location.hostname) +
      ' is shared by every project on that account, so keep the token scoped to this one repo.'));

    var row = el('div', 'btn-row');
    var save = el('button', 'btn', 'Connect');
    save.addEventListener('click', function () {
      var v = (inp.value || '').trim();
      if (!v) return;
      setToken(v); A.msg = ''; loadWatches();
    });
    row.appendChild(save);
    c.appendChild(row);
    return c;
  }

  function watchCard(w, index, readOnly) {
    var expired = isExpired(w);
    var card = el('div', 'watch' + (w.enabled === false ? ' off' : '') + (expired ? ' expired' : ''));
    var d = describe(w);

    var top = el('div', 'watch-top');
    top.appendChild(el('h4', null, w.label || d.who));
    if (!readOnly) {
      var sw = el('button', 'switch' + (w.enabled === false ? '' : ' on'));
      sw.type = 'button';
      sw.setAttribute('aria-label', w.enabled === false ? 'Enable alert' : 'Disable alert');
      sw.addEventListener('click', function () {
        A.watches[index].enabled = (w.enabled === false);
        saveWatches();
      });
      top.appendChild(sw);
    }
    card.appendChild(top);

    var meta = el('dl');
    meta.appendChild(el('div', null, d.who));
    meta.appendChild(el('div', null, d.when + ' · ' + d.span));
    if (d.extra) meta.appendChild(el('div', null, d.extra));
    card.appendChild(meta);

    var tags = el('div', 'tagrow');
    var n = countMatches(w);
    tags.appendChild(el('span', 'pill' + (n ? '' : ' grey'),
      n ? n + ' matching now' : 'nothing matching now'));
    if (expired) tags.appendChild(el('span', 'pill warn', 'date passed'));
    if (w.enabled === false) tags.appendChild(el('span', 'pill grey', 'off'));
    card.appendChild(tags);

    if (!readOnly) {
      var row = el('div', 'btn-row');
      var del = el('button', 'btn danger', 'Delete');
      del.addEventListener('click', function () {
        A.watches.splice(index, 1);
        saveWatches();
      });
      row.appendChild(del);
      card.appendChild(row);
    }
    return card;
  }

  function draftForm() {
    var d = A.draft;
    var c = el('div', 'card2');
    c.appendChild(el('h3', null, 'New alert'));

    // courses
    var cw = el('div', null);
    var lbl = el('div', null, 'Courses');
    lbl.style.cssText = 'font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-bottom:8px';
    cw.appendChild(lbl);
    var chips = el('div', 'chips');

    var anyOn = d.courses.indexOf('any') > -1;
    var anyChip = el('button', 'chip' + (anyOn ? ' on' : ''), 'Any course');
    anyChip.type = 'button';
    anyChip.addEventListener('click', function () { d.courses = ['any']; renderAlerts(); });
    chips.appendChild(anyChip);

    (state.data && state.data.courses || []).forEach(function (co) {
      var on = d.courses.indexOf(co.id) > -1;
      var b = el('button', 'chip' + (on ? ' on' : ''), shortName(co.name));
      b.type = 'button'; b.title = co.name;
      b.addEventListener('click', function () {
        var i = d.courses.indexOf(co.id);
        if (i > -1) d.courses.splice(i, 1);
        else {
          var a = d.courses.indexOf('any');
          if (a > -1) d.courses.splice(a, 1);
          d.courses.push(co.id);
        }
        if (!d.courses.length) d.courses = ['any'];
        renderAlerts();
      });
      chips.appendChild(b);
    });
    cw.appendChild(chips);
    c.appendChild(cw);

    // date / times
    var grid = el('div', null);
    grid.style.cssText = 'display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(120px,1fr))';
    grid.appendChild(fieldInput('Date', 'date', d.date, function (v) { d.date = v; renderAlerts(); }));
    grid.appendChild(fieldInput('Earliest', 'time', d.timeFrom, function (v) { d.timeFrom = v; renderAlerts(); }));
    grid.appendChild(fieldInput('Latest', 'time', d.timeTo, function (v) { d.timeTo = v; renderAlerts(); }));
    c.appendChild(grid);

    // holes + players
    var segs = el('div', 'row');
    segs.appendChild(segGroup(['Any', '9', '18'], d.holes == null ? 0 : (d.holes === 9 ? 1 : 2), function (i) {
      d.holes = i === 0 ? null : (i === 1 ? 9 : 18); renderAlerts();
    }));
    segs.appendChild(segGroup(['1+', '2+', '4'], d.minSpots === 4 ? 2 : (d.minSpots === 2 ? 1 : 0), function (i) {
      d.minSpots = [1, 2, 4][i]; renderAlerts();
    }));
    c.appendChild(segs);

    // live match count
    var probe = draftToWatch(d);
    var n = countMatches(probe);
    var note = el('div', 'match-note' + (n ? '' : ' zero'));
    if (n) {
      note.innerHTML = 'Right now this would catch <b>' + n + '</b> tee time' + (n === 1 ? '' : 's') +
        '. You will be alerted when a new one appears.';
    } else {
      note.textContent = 'Nothing open matches this right now — which is exactly when an alert is useful. '
        + 'But double-check the date and time range if you expected something.';
    }
    c.appendChild(note);

    var row = el('div', 'btn-row');
    var save = el('button', 'btn', A.saving ? 'Saving…' : 'Create alert');
    save.disabled = !!A.saving;
    save.addEventListener('click', function () {
      A.watches = (A.watches || []).concat([draftToWatch(d)]);
      A.draft = null;
      saveWatches();
    });
    var cancel = el('button', 'btn ghost', 'Cancel');
    cancel.addEventListener('click', function () { A.draft = null; renderAlerts(); });
    row.appendChild(save); row.appendChild(cancel);
    c.appendChild(row);
    return c;
  }

  function fieldInput(label, type, value, onChange) {
    var f = el('label', 'field');
    f.appendChild(el('span', null, label));
    var i = document.createElement('input');
    i.type = type; i.value = value || '';
    if (type === 'time') i.step = '900';
    i.addEventListener('change', function () { onChange(this.value); });
    f.appendChild(i);
    return f;
  }

  function segGroup(labels, activeIndex, onPick) {
    var g = el('div', 'seg');
    labels.forEach(function (t, i) {
      var b = el('button', i === activeIndex ? 'on' : '', t);
      b.type = 'button';
      b.addEventListener('click', function (ev) { ev.stopPropagation(); onPick(i); });
      g.appendChild(b);
    });
    return g;
  }

  function showAlerts(on) {
    document.body.setAttribute('data-view', on ? 'alerts' : 'times');
    $('#alerts-btn').classList.toggle('on', !!on);
    if (on && A.watches === null) loadWatches();
    else if (on) renderAlerts();
  }

  $('#alerts-btn').addEventListener('click', function () {
    showAlerts(document.body.getAttribute('data-view') !== 'alerts');
  });

  // Badge: how many enabled alerts are live.
  function refreshBadge() {
    var b = $('#alerts-btn');
    var old = b.querySelector('.badge');
    if (old) old.remove();
    var n = (A.watches || []).filter(function (w) {
      return w.enabled !== false && !isExpired(w);
    }).length;
    if (n) b.appendChild(el('span', 'badge', String(n)));
  }
  var _renderAlerts = renderAlerts;
  renderAlerts = function () { _renderAlerts(); refreshBadge(); };

  // Load the published copy up front so the badge is right before you tap in.
  loadWatches();

  load(false);
})();
</script>
</body>
</html>
