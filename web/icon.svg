<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Golf O'Clock" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- App icon. Deliberately stripped to one shape: a golf ball as a clock face,
       teed up. The landscape from the original illustration is dropped — at 48px
       trees and clouds turn to noise. Everything sits inside the maskable safe
       zone (a circle of radius ~205 from centre). -->
  <rect width="512" height="512" fill="#16295c"/>

  <!-- grass tuft -->
  <g stroke="#4a9b3f" stroke-width="13" stroke-linecap="round" fill="none">
    <path d="M214 432c-14-10-22-26-24-44"/>
    <path d="M232 436c-8-14-11-30-9-46"/>
    <path d="M298 432c14-10 22-26 24-44"/>
    <path d="M280 436c8-14 11-30 9-46"/>
  </g>

  <!-- tee -->
  <path d="M231 356h50l-9 82a16 16 0 0 1-32 0z" fill="#ffffff"/>
  <path d="M222 350h68a10 10 0 0 1 0 20h-68a10 10 0 0 1 0-20z" fill="#ffffff"/>

  <!-- ball + ring -->
  <circle cx="256" cy="236" r="146" fill="#16295c"/>
  <circle cx="256" cy="236" r="134" fill="none" stroke="#7cc142" stroke-width="26"/>
  <circle cx="256" cy="236" r="113" fill="#ffffff"/>

  <!-- dimples: texture at large sizes, invisible and harmless at small ones -->
  <g fill="#c9d4e6" opacity=".55">
    <circle cx="256" cy="150" r="8"/><circle cx="212" cy="166" r="8"/><circle cx="300" cy="166" r="8"/>
    <circle cx="184" cy="204" r="8"/><circle cx="328" cy="204" r="8"/>
    <circle cx="176" cy="252" r="8"/><circle cx="336" cy="252" r="8"/>
    <circle cx="196" cy="298" r="8"/><circle cx="316" cy="298" r="8"/>
    <circle cx="238" cy="324" r="8"/><circle cx="288" cy="324" r="8"/>
  </g>

  <!-- clock hands -->
  <g stroke="#16295c" stroke-width="19" stroke-linecap="round" fill="none">
    <path d="M256 236 199 179"/>
    <path d="M256 236 325 292"/>
  </g>
  <circle cx="256" cy="236" r="15" fill="#4a9b3f"/>
</svg>
